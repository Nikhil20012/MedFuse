# MedFuse training configuration

data:
  dataset_name: "aptos2019"
  data_dir: "data/processed"
  image_size: 512
  # Per-grade sample cap for fine-tuning (keeps GPU time reasonable)
  max_samples_per_grade: null
  val_split: 0.1
  num_workers: 4

model:
  pretrained_model: "stabilityai/stable-diffusion-2-1-base"
  # LoRA hyperparameters
  lora_rank: 4
  lora_alpha: 4
  # Which UNet layers get LoRA adapters
  target_modules:
    - "to_q"
    - "to_k"
    - "to_v"
    - "to_out.0"

training:
  learning_rate: 1.0e-4
  lr_scheduler: "cosine"
  lr_warmup_steps: 500
  max_train_steps: 4000
  train_batch_size: 1
  gradient_accumulation_steps: 4
  mixed_precision: "fp16"
  seed: 42
  checkpointing_steps: 500
  validation_steps: 250
  # How many sample images to generate during validation
  num_validation_images: 4

generation:
  num_inference_steps: 50
  scheduler: "ddim"
  guidance_scale: 7.5
  # How many synthetic images to generate per grade
  num_images_per_grade:
    0: 0        # Grade 0 is already overrepresented
    1: 200
    2: 300
    3: 800      # Severe - most underrepresented
    4: 800      # Proliferative - most underrepresented
  negative_prompt: "blurry, low quality, artifacts, text, watermark, out of focus, distorted"

evaluation:
  downstream_model: "efficientnet_b0"
  downstream_epochs: 30
  downstream_lr: 1.0e-3
  downstream_batch_size: 32
  # Synthetic-to-real ratios for ablation study
  augmentation_ratios: [0.0, 0.25, 0.5, 1.0, 2.0]

wandb:
  project: "medfuse"
  entity: null  # Set to your W&B username
  tags: ["diabetic-retinopathy", "diffusion", "lora", "data-augmentation"]
